<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulsarGames — загрузка игр</title>
    
    <!-- ===== FIREBASE ===== -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a1a;
            --bg-card: rgba(255, 255, 255, 0.03);
            --bg-input: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.06);
            --text: #e8e8f0;
            --text-secondary: rgba(255, 255, 255, 0.5);
            --text-muted: rgba(255, 255, 255, 0.2);
            --nebula: #00d4ff;
            --nebula-glow: rgba(0, 212, 255, 0.1);
            --nebula-gradient: linear-gradient(135deg, #00d4ff, #0099cc);
            --radius: 16px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .glass-container {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 25px;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(0, 212, 255, 0.06);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        .logo {
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 2.8em;
            font-weight: 700;
            text-align: center;
            color: #E0F4FF;
            text-shadow: 0 0 60px rgba(0, 212, 255, 0.15);
        }

        .logo span {
            color: var(--nebula);
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9em;
            margin-bottom: 24px;
            letter-spacing: 2px;
        }

        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 8px;
            border: none;
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 0.7em;
            letter-spacing: 1px;
            cursor: pointer;
            transition: var(--transition);
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            min-width: 60px;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .tab-btn:hover {
            background: var(--bg-input);
            color: var(--text);
        }

        .tab-btn.active {
            background: var(--nebula-glow);
            border-color: rgba(0, 212, 255, 0.2);
            color: var(--nebula);
            box-shadow: 0 0 30px var(--nebula-glow);
        }

        .tab-content {
            display: none;
            animation: fadeSlide 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .glass-input {
            width: 100%;
            padding: 12px 16px;
            margin: 6px 0 12px 0;
            border: none;
            border-radius: var(--radius);
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 1em;
            transition: var(--transition);
            outline: none;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .glass-input:focus {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(0, 212, 255, 0.2);
            box-shadow: 0 0 30px var(--nebula-glow);
        }

        .glass-input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        textarea.glass-input {
            resize: vertical;
            min-height: 70px;
        }

        .glass-btn {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            border: none;
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 0.85em;
            letter-spacing: 1px;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .btn-nebula {
            background: var(--nebula-gradient);
            color: #05050f;
            box-shadow: 0 8px 24px var(--nebula-glow);
        }

        .btn-nebula:hover {
            transform: scale(1.01);
            box-shadow: 0 12px 36px rgba(0, 212, 255, 0.25);
        }

        .btn-ghost {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-ghost:hover {
            background: var(--bg-input);
            color: var(--text);
        }

        .btn-danger {
            background: rgba(255, 50, 50, 0.08);
            color: #ff6666;
            border: 1px solid rgba(255, 50, 50, 0.1);
        }

        .btn-danger:hover {
            background: rgba(255, 50, 50, 0.15);
        }

        .btn-success {
            background: rgba(0, 200, 100, 0.08);
            color: #66dd88;
            border: 1px solid rgba(0, 200, 100, 0.1);
        }

        .btn-success:hover {
            background: rgba(0, 200, 100, 0.15);
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.7em;
            width: auto;
            display: inline-block;
            margin: 2px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Segoe UI', system-ui, sans-serif;
            text-decoration: none;
        }

        .btn-small:hover {
            transform: scale(1.05);
        }

        .btn-download {
            background: rgba(0, 212, 255, 0.15);
            color: var(--nebula);
            border: 1px solid rgba(0, 212, 255, 0.1);
        }

        .btn-download:hover {
            background: rgba(0, 212, 255, 0.25);
        }

        .btn-delete {
            background: rgba(255, 50, 50, 0.08);
            color: #ff6666;
            border: 1px solid rgba(255, 50, 50, 0.05);
        }

        .btn-delete:hover {
            background: rgba(255, 50, 50, 0.15);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .game-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 16px 18px;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .game-card:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
            border-color: rgba(0, 212, 255, 0.1);
        }

        .game-card .preview {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 12px;
            overflow: hidden;
            background: var(--bg-input);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin-bottom: 8px;
        }

        .game-card .preview img,
        .game-card .preview video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-card .game-title {
            font-size: 1.1em;
            font-weight: 700;
            color: var(--nebula);
        }

        .game-card .game-dev {
            color: var(--text-secondary);
            font-size: 0.85em;
        }

        .game-card .game-genre {
            color: var(--text-secondary);
            font-size: 0.7em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 2px 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            align-self: flex-start;
            margin: 4px 0;
        }

        .game-card .game-status {
            font-size: 0.7em;
            padding: 2px 12px;
            border-radius: 20px;
            align-self: flex-start;
            margin: 4px 0;
        }

        .status-pending {
            background: rgba(255, 200, 50, 0.1);
            border: 1px solid rgba(255, 200, 50, 0.15);
            color: #ffd866;
        }

        .status-approved {
            background: rgba(50, 255, 150, 0.08);
            border: 1px solid rgba(50, 255, 150, 0.1);
            color: #66ffaa;
        }

        .status-rejected {
            background: rgba(255, 50, 50, 0.08);
            border: 1px solid rgba(255, 50, 50, 0.1);
            color: #ff6666;
        }

        .game-card .card-actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .game-card .game-desc {
            color: var(--text-secondary);
            font-size: 0.85em;
            line-height: 1.4;
            margin: 4px 0;
            flex: 1;
        }

        .game-week-badge {
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: #ffd866;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.65em;
            align-self: flex-start;
            margin: 2px 0;
        }

        .game-file-link {
            background: var(--bg-input);
            border-radius: 12px;
            padding: 8px 12px;
            margin: 4px 0;
            font-size: 0.75em;
            color: var(--text-secondary);
            word-break: break-all;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .game-file-link a {
            color: var(--nebula);
            text-decoration: none;
            font-weight: 600;
        }

        .game-file-link a:hover {
            text-decoration: underline;
        }

        .empty-state {
            color: var(--text-muted);
            text-align: center;
            padding: 40px 0;
            grid-column: 1/-1;
        }

        .empty-state .icon {
            font-size: 3em;
            display: block;
            margin-bottom: 12px;
            opacity: 0.3;
        }

        .auth-block {
            max-width: 400px;
            margin: 0 auto;
        }

        .user-greeting {
            color: var(--text-secondary);
            font-size: 1em;
        }

        .user-greeting span {
            color: var(--nebula);
            font-weight: 700;
        }

        .hidden {
            display: none !important;
        }

        .message {
            text-align: center;
            margin: 8px 0;
            font-size: 0.9em;
        }

        .message.success {
            color: #66ddbb;
        }
        .message.error {
            color: #ff6666;
        }

        .divider {
            margin: 16px 0;
            border: none;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--border), transparent);
        }

        .footer-note {
            margin-top: 20px;
            text-align: center;
            color: rgba(255, 255, 255, 0.1);
            font-size: 0.6em;
            letter-spacing: 2px;
        }

        .hosting-tip {
            background: var(--nebula-glow);
            border: 1px solid rgba(0, 212, 255, 0.1);
            border-radius: 12px;
            padding: 12px 16px;
            margin: 8px 0;
            font-size: 0.8em;
            color: var(--text-secondary);
        }

        .hosting-tip strong {
            color: var(--nebula);
        }

        @media (max-width: 600px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }
            .glass-container {
                padding: 16px 12px;
            }
            .logo {
                font-size: 2em;
            }
            .tab-btn {
                font-size: 0.6em;
                padding: 8px 4px;
                min-width: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="glass-container">
        <div class="logo">PULSAR<span>GAMES</span></div>
        <div class="subtitle">✦ живые игры ✦</div>

        <!-- ===== АВТОРИЗАЦИЯ ===== -->
        <div id="authBlock" class="auth-block">
            <input class="glass-input" type="email" id="loginInput" placeholder="почта" />
            <input class="glass-input" type="password" id="passInput" placeholder="пароль" />
            <button class="glass-btn btn-nebula" id="registerBtn">зарегистрироваться</button>
            <button class="glass-btn btn-ghost" id="loginBtn">войти</button>
            <div id="authMessage" class="message"></div>
        </div>

        <!-- ===== ПОЛЬЗОВАТЕЛЬСКАЯ ЧАСТЬ ===== -->
        <div id="userBlock" class="hidden">
            <div class="user-greeting">👋 привет, <span id="userName"></span></div>
            <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:4px;">
                <button class="glass-btn btn-danger" id="logoutBtn" style="flex:1; margin:0;">выйти</button>
            </div>

            <hr class="divider" />

            <!-- ===== ТАБЫ ===== -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="games">🎮 игры</button>
                <button class="tab-btn" data-tab="upload">📤 загрузить</button>
                <button class="tab-btn" data-tab="my">📁 мои игры</button>
                <button class="tab-btn" data-tab="admin" id="adminTab" style="display:none;">👑 админ</button>
            </div>

            <!-- ===== ВКЛАДКА: ИГРЫ ===== -->
            <div class="tab-content active" id="tabGames">
                <div class="games-grid" id="gamesGrid"></div>
            </div>

            <!-- ===== ВКЛАДКА: ЗАГРУЗКА ===== -->
            <div class="tab-content" id="tabUpload">
                <h3 style="color:var(--text-secondary);font-weight:400;font-size:0.9em;letter-spacing:1px;margin-bottom:12px;">📤 загрузить новую игру</h3>
                
                <input class="glass-input" type="text" id="gameTitle" placeholder="название игры" />
                <input class="glass-input" type="text" id="gameDeveloper" placeholder="разработчик" />
                <input class="glass-input" type="text" id="gameGenre" placeholder="жанр" />
                <textarea class="glass-input" id="gameDescription" rows="3" placeholder="описание игры"></textarea>
                
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                    <input class="glass-input" type="text" id="gamePreviewUrl" placeholder="🔗 ссылка на превью (картинка)" />
                    <input class="glass-input" type="text" id="gameTrailerUrl" placeholder="🎬 ссылка на трейлер (видео)" />
                </div>

                <!-- ===== ССЫЛКА НА ФАЙЛ ===== -->
                <div style="margin:6px 0 12px 0;">
                    <label style="color:var(--text-secondary);font-size:0.85em;display:block;margin-bottom:4px;">📦 ссылка на файл игры (.exe или .app)</label>
                    <input class="glass-input" type="text" id="gameFileUrl" placeholder="https://ваш-хостинг.com/игра.exe" style="margin:0;" />
                    
                    <div class="hosting-tip">
                        💡 <strong>Где взять ссылку?</strong><br />
                        Загрузите файл на любой хостинг и вставьте ссылку:<br />
                        • Google Drive (сделайте ссылку публичной)<br />
                        • Yandex Disk<br />
                        • MediaFire<br />
                        • GitHub Releases<br />
                        • Ваш собственный сервер
                    </div>
                </div>

                <button class="glass-btn btn-nebula" id="uploadGameBtn">📤 загрузить игру</button>
                <div id="uploadMessage" class="message"></div>
            </div>

            <!-- ===== ВКЛАДКА: МОИ ИГРЫ ===== -->
            <div class="tab-content" id="tabMy">
                <div class="games-grid" id="myGamesGrid"></div>
            </div>

            <!-- ===== ВКЛАДКА: АДМИН ===== -->
            <div class="tab-content" id="tabAdmin">
                <h3 style="color:var(--text-secondary);font-weight:400;font-size:0.9em;letter-spacing:1px;margin-bottom:12px;">👑 управление играми</h3>
                <div class="games-grid" id="adminGamesGrid"></div>
            </div>
        </div>

        <div class="footer-note">PULSAR GAMES · 2024</div>
    </div>

    <script>
        // ============================================================
        // 1. FIREBASE
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBTXrdsl_SmJkFSBRT2gvtSJ6Iw4LvULXM",
            authDomain: "pulsargames-3ebc9.firebaseapp.com",
            projectId: "pulsargames-3ebc9",
            storageBucket: "pulsargames-3ebc9.firebasestorage.app",
            messagingSenderId: "503864871102",
            appId: "1:503864871102:web:0768bdfe18943933e976ef"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================================
        // 2. ПЕРЕМЕННЫЕ
        // ============================================================
        let currentUser = null;
        let currentUserEmail = null;
        let allGames = [];
        let userGames = [];
        let isAdmin = false;

        const CHIEF_EMAIL = 'voyager4vodorod@gmail.com';

        // ============================================================
        // 3. ВСПОМОГАТЕЛЬНЫЕ
        // ============================================================
        function notify(title, text) {
            const el = document.createElement('div');
            el.style.cssText = `
                position: fixed; bottom: 20px; right: 20px;
                background: rgba(10,10,26,0.95); backdrop-filter: blur(16px);
                color: #e8e8f0; padding: 12px 20px; border-radius: 16px;
                border: 1px solid rgba(0,212,255,0.1);
                box-shadow: 0 10px 30px rgba(0,0,0,0.5);
                z-index: 999; max-width: 300px;
                font-family: 'Segoe UI', system-ui, sans-serif;
                animation: slideIn 0.3s ease;
            `;
            el.innerHTML = `<div style="color:#00d4ff;font-weight:700;">${title}</div><div style="color:rgba(255,255,255,0.5);font-size:0.85em;">${text}</div>`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 4000);
        }

        function timeAgo(dateStr) {
            if (!dateStr) return 'только что';
            const now = new Date();
            const then = new Date(dateStr);
            const diff = Math.floor((now - then) / 1000);
            if (diff < 60) return 'только что';
            if (diff < 3600) return Math.floor(diff / 60) + ' мин назад';
            if (diff < 86400) return Math.floor(diff / 3600) + ' ч назад';
            return then.toLocaleDateString('ru-RU');
        }

        function getFileExtension(url) {
            const parts = url.split('.');
            return parts.length > 1 ? parts[parts.length - 1].split('?')[0].toLowerCase() : '';
        }

        // ============================================================
        // 4. ЗАГРУЗКА ИГРЫ
        // ============================================================
        document.getElementById('uploadGameBtn').addEventListener('click', async function() {
            if (!currentUser) {
                notify('❌ ошибка', 'сначала войдите в систему');
                return;
            }

            const title = document.getElementById('gameTitle').value.trim();
            const developer = document.getElementById('gameDeveloper').value.trim();
            const genre = document.getElementById('gameGenre').value.trim();
            const description = document.getElementById('gameDescription').value.trim();
            const previewUrl = document.getElementById('gamePreviewUrl').value.trim();
            const trailerUrl = document.getElementById('gameTrailerUrl').value.trim();
            const fileUrl = document.getElementById('gameFileUrl').value.trim();

            const msg = document.getElementById('uploadMessage');

            if (!title || !developer) {
                msg.innerText = '❌ заполните название и разработчика';
                msg.className = 'message error';
                return;
            }

            if (!fileUrl) {
                msg.innerText = '❌ введите ссылку на файл игры';
                msg.className = 'message error';
                return;
            }

            // Проверяем расширение файла
            const ext = getFileExtension(fileUrl);
            if (!['exe', 'app'].includes(ext)) {
                msg.innerText = '❌ ссылка должна вести на .exe или .app файл';
                msg.className = 'message error';
                return;
            }

            msg.innerText = '⏳ загрузка...';
            msg.className = 'message';

            try {
                // Получаем имя файла из ссылки
                const fileName = fileUrl.split('/').pop() || 'game.' + ext;

                await db.collection('games').add({
                    title,
                    developer,
                    genre: genre || 'не указан',
                    description: description || '—',
                    previewUrl: previewUrl || null,
                    trailerUrl: trailerUrl || null,
                    fileUrl: fileUrl,
                    fileName: fileName,
                    fileSize: 0, // неизвестно
                    status: 'pending',
                    isGameOfWeek: false,
                    submittedBy: currentUser,
                    submittedByEmail: currentUserEmail,
                    createdAt: new Date().toISOString(),
                    downloads: 0
                });

                msg.innerText = '✅ игра успешно загружена! ожидает проверки';
                msg.className = 'message success';
                notify('✅ игра загружена', title);

                // Очищаем форму
                document.getElementById('gameTitle').value = '';
                document.getElementById('gameDeveloper').value = '';
                document.getElementById('gameGenre').value = '';
                document.getElementById('gameDescription').value = '';
                document.getElementById('gamePreviewUrl').value = '';
                document.getElementById('gameTrailerUrl').value = '';
                document.getElementById('gameFileUrl').value = '';

                loadGames();
                loadUserGames();

            } catch (error) {
                msg.innerText = '❌ ошибка: ' + error.message;
                msg.className = 'message error';
                notify('❌ ошибка', error.message);
            }
        });

        // ============================================================
        // 5. ЗАГРУЗКА ИГР ИЗ FIRESTORE
        // ============================================================
        function loadGames() {
            db.collection('games')
                .where('status', '==', 'approved')
                .orderBy('createdAt', 'desc')
                .get()
                .then((snapshot) => {
                    allGames = [];
                    snapshot.forEach(doc => {
                        allGames.push({ id: doc.id, ...doc.data() });
                    });
                    renderGames();
                })
                .catch(() => {});
        }

        function loadUserGames() {
            if (!currentUser) return;

            db.collection('games')
                .where('submittedBy', '==', currentUser)
                .orderBy('createdAt', 'desc')
                .get()
                .then((snapshot) => {
                    userGames = [];
                    snapshot.forEach(doc => {
                        userGames.push({ id: doc.id, ...doc.data() });
                    });
                    renderMyGames();
                })
                .catch(() => {});
        }

        function loadAdminGames() {
            if (!isAdmin) return;

            db.collection('games')
                .where('status', '==', 'pending')
                .orderBy('createdAt', 'desc')
                .get()
                .then((snapshot) => {
                    const pendingGames = [];
                    snapshot.forEach(doc => {
                        pendingGames.push({ id: doc.id, ...doc.data() });
                    });
                    renderAdminGames(pendingGames);
                })
                .catch(() => {});
        }

        // ============================================================
        // 6. ОТОБРАЖЕНИЕ ИГР
        // ============================================================
        function renderGames() {
            const container = document.getElementById('gamesGrid');
            if (!container) return;

            if (allGames.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">🎮</span>
                        игр пока нет
                    </div>
                `;
                return;
            }

            let html = '';
            allGames.forEach(game => {
                html += renderGameCard(game);
            });
            container.innerHTML = html;
        }

        function renderMyGames() {
            const container = document.getElementById('myGamesGrid');
            if (!container) return;

            if (userGames.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">📁</span>
                        вы ещё не загрузили ни одной игры
                    </div>
                `;
                return;
            }

            let html = '';
            userGames.forEach(game => {
                html += renderGameCard(game);
            });
            container.innerHTML = html;
        }

        function renderAdminGames(pendingGames) {
            const container = document.getElementById('adminGamesGrid');
            if (!container) return;

            if (pendingGames.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">✅</span>
                        нет игр на проверке
                    </div>
                `;
                return;
            }

            let html = '';
            pendingGames.forEach(game => {
                html += renderGameCard(game, true);
            });
            container.innerHTML = html;
        }

        function renderGameCard(game, isAdminView = false) {
            const statusText = {
                'pending': '⏳ на проверке',
                'approved': '✅ одобрена',
                'rejected': '❌ отклонена'
            };

            const statusClass = {
                'pending': 'status-pending',
                'approved': 'status-approved',
                'rejected': 'status-rejected'
            };

            const weekBadge = game.isGameOfWeek ? '<span class="game-week-badge">⭐ игра недели</span>' : '';

            let previewHtml = '';
            if (game.previewUrl) {
                previewHtml = `<img src="${game.previewUrl}" alt="${game.title}" />`;
            } else {
                previewHtml = `🎮`;
            }

            let actionsHtml = '';
            if (isAdminView) {
                actionsHtml = `
                    <div class="card-actions">
                        <button class="btn-small btn-success" onclick="approveGame('${game.id}')">✅ одобрить</button>
                        <button class="btn-small btn-danger" onclick="rejectGame('${game.id}')">❌ отклонить</button>
                    </div>
                `;
            } else if (game.status === 'approved' && game.fileUrl) {
                actionsHtml = `
                    <div class="card-actions">
                        <a href="${game.fileUrl}" target="_blank" class="btn-small btn-download" style="text-decoration:none;">⬇ скачать</a>
                    </div>
                `;
            }

            const fileInfo = game.fileUrl ? `
                <div class="game-file-link">
                    📎 <a href="${game.fileUrl}" target="_blank">${game.fileName || 'скачать файл'}</a>
                    ${game.downloads ? `· ⬇ ${game.downloads} загрузок` : ''}
                </div>
            ` : '';

            return `
                <div class="game-card">
                    <div class="preview">${previewHtml}</div>
                    <div class="game-title">${game.title}</div>
                    <div class="game-dev">${game.developer}</div>
                    <span class="game-genre">${game.genre}</span>
                    ${weekBadge}
                    <span class="game-status ${statusClass[game.status] || ''}">${statusText[game.status] || game.status}</span>
                    ${fileInfo}
                    <div class="game-desc">${game.description}</div>
                    ${game.trailerUrl ? `<div style="font-size:0.7em;color:var(--text-muted);">🎬 трейлер: <a href="${game.trailerUrl}" target="_blank" style="color:var(--nebula);">смотреть</a></div>` : ''}
                    ${actionsHtml}
                </div>
            `;
        }

        // ============================================================
        // 7. АДМИН-ФУНКЦИИ
        // ============================================================
        window.approveGame = function(gameId) {
            db.collection('games').doc(gameId).update({
                status: 'approved'
            }).then(() => {
                notify('✅ игра одобрена', '');
                loadGames();
                loadUserGames();
                loadAdminGames();
            }).catch((error) => {
                notify('❌ ошибка', error.message);
            });
        };

        window.rejectGame = function(gameId) {
            db.collection('games').doc(gameId).update({
                status: 'rejected'
            }).then(() => {
                notify('❌ игра отклонена', '');
                loadGames();
                loadUserGames();
                loadAdminGames();
            }).catch((error) => {
                notify('❌ ошибка', error.message);
            });
        };

        // ============================================================
        // 8. ТАБЫ
        // ============================================================
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));

                const tabMap = {
                    'games': 'tabGames',
                    'upload': 'tabUpload',
                    'my': 'tabMy',
                    'admin': 'tabAdmin'
                };

                const target = document.getElementById(tabMap[this.dataset.tab]);
                if (target) target.classList.add('active');

                if (this.dataset.tab === 'admin') {
                    loadAdminGames();
                }
            });
        });

        // ============================================================
        // 9. АВТОРИЗАЦИЯ
        // ============================================================
        function showUser() {
            document.getElementById('authBlock').classList.add('hidden');
            document.getElementById('userBlock').classList.remove('hidden');
            document.getElementById('userName').innerText = currentUserEmail;

            if (currentUserEmail === CHIEF_EMAIL) {
                isAdmin = true;
                document.getElementById('adminTab').style.display = 'block';
            } else {
                db.collection('admins').where('email', '==', currentUserEmail).get()
                    .then((snapshot) => {
                        if (!snapshot.empty) {
                            isAdmin = true;
                            document.getElementById('adminTab').style.display = 'block';
                        }
                    });
            }

            loadGames();
            loadUserGames();
        }

        function registerUser() {
            const email = document.getElementById('loginInput').value.trim();
            const pass = document.getElementById('passInput').value.trim();
            const msg = document.getElementById('authMessage');

            if (!email || !pass) {
                msg.innerText = '❌ заполните все поля';
                msg.className = 'message error';
                return;
            }

            auth.createUserWithEmailAndPassword(email, pass)
                .then(() => {
                    msg.innerText = '✅ регистрация успешна! войдите.';
                    msg.className = 'message success';
                })
                .catch((error) => {
                    msg.innerText = '❌ ' + error.message;
                    msg.className = 'message error';
                });
        }

        function loginUser() {
            const email = document.getElementById('loginInput').value.trim();
            const pass = document.getElementById('passInput').value.trim();
            const msg = document.getElementById('authMessage');

            if (!email || !pass) {
                msg.innerText = '❌ заполните все поля';
                msg.className = 'message error';
                return;
            }

            auth.signInWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    currentUser = userCredential.user.uid;
                    currentUserEmail = userCredential.user.email;
                    showUser();
                    notify('👋 добро пожаловать', 'ты в PulsarGames');
                })
                .catch((error) => {
                    msg.innerText = '❌ ' + error.message;
                    msg.className = 'message error';
                });
        }

        function logoutUser() {
            auth.signOut();
            currentUser = null;
            currentUserEmail = null;
            isAdmin = false;
            document.getElementById('authBlock').classList.remove('hidden');
            document.getElementById('userBlock').classList.add('hidden');
            document.getElementById('adminTab').style.display = 'none';
        }

        document.getElementById('registerBtn').addEventListener('click', registerUser);
        document.getElementById('loginBtn').addEventListener('click', loginUser);
        document.getElementById('logoutBtn').addEventListener('click', logoutUser);

        // ============================================================
        // 10. АВТО-ВХОД
        // ============================================================
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user.uid;
                currentUserEmail = user.email;
                if (document.getElementById('authBlock').classList.contains('hidden')) {
                    loadGames();
                    loadUserGames();
                } else {
                    showUser();
                }
            }
        });

        console.log('🚀 PulsarGames загружен!');
        console.log('👑 Главарь: voyager4vodorod@gmail.com');
        console.log('📦 Файлы загружаются по ссылке (без Storage)');
    </script>
</body>
</html>
