        .auth-modal-title {

            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #ffffff, #b0d4ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .auth-modal .auth-form {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .auth-modal .auth-form input {
            background: rgba(255, 255, 255, 0.03);

        @keyframes glassPulse {

        @media (max-width: 720px) {

            }
            .brand h1 { font-size: 1.6rem; }

            }

        }

        @media (max-width: 480px) {

        .admin-panel-toggle {

        }

        .error-message {
            color: #ff6666;

    </style>
</head>
<body>

<div class="app-wrapper">

    <header class="header-glass">
        <div class="brand">
            <h1>PulsarGames</h1>
            <span class="tagline-mini">✦ живые игры</span>
        </div>
        <div class="auth-pill" id="authPill">
            <span class="user-email" id="userEmailDisplay">Гость</span>
            <span class="user-role" id="userRoleDisplay">—</span>
            <button class="admin-panel-toggle" id="adminPanelToggle" style="display:none;">👑 Панель</button>
            <button class="auth-btn" id="loginBtn">Войти</button>
            <button class="logout-btn" id="logoutBtn" style="display:none;">Выйти</button>
        </div>
    </header>

    <div class="error-message" id="errorMessage">⚠️ Ошибка</div>

    <div class="add-game-form" id="addGameForm">
        <h3 style="font-weight:400; font-size:1.3rem;">➕ Отправить игру на проверку</h3>
        <div class="form-row">
            <input type="text" id="gameTitle" placeholder="Название игры" />
            <input type="text" id="gameDeveloper" placeholder="Разработчик" />
        </div>
        <div class="form-row">
            <input type="text" id="gameGenre" placeholder="Жанр" />
            <select id="mediaType">
                <option value="image">Изображение</option>
                <option value="video">Видео</option>
            </select>
        </div>
        <input type="text" id="mediaUrl" placeholder="Ссылка на изображение или видео (URL)" />
        <textarea id="gameDescription" placeholder="Описание игры..."></textarea>
        <button class="submit-btn" id="submitGameBtn">📤 Отправить на проверку</button>
    </div>

    <h2 class="section-title" id="gamesTitle">📚 Все игры</h2>
    <div class="games-grid" id="gamesGrid"></div>

</div>

<div class="auth-modal" id="authModal">
    <div class="auth-modal-content">
        <button class="auth-modal-close" id="authModalClose">✕</button>
        <div class="auth-modal-title">⚡ Вход в Pulsar</div>

            <input type="password" id="modalPassword" placeholder="Пароль" required minlength="6" />
            <div class="form-row">
                <button type="submit" class="auth-btn" id="modalSignUpBtn">Зарегистрироваться</button>
                <button type="button" class="auth-btn" id="modalSignInBtn">Войти</button>
            </div>
        </form>
        <div class="auth-status" id="modalStatus">Войдите или создайте аккаунт</div>
    </div>
</div>

            genre: 'Action RPG',
            mediaType: 'image',
            mediaUrl: 'https://images.unsplash.com/photo-1612287230202-1ff1d85d1bdf?w=600',
            description: 'Восстаньте, потерявший свет, и направляйтесь к Кольцу.',
            status: 'pending',
            isGameOfWeek: false
        },
        {
            title: 'God of War Ragnarok',
            developer: 'Santa Monica Studio',
            genre: 'Action / Adventure',
            mediaType: 'image',
            mediaUrl: 'https://images.unsplash.com/photo-1592155931584-901ac15763e3?w=600',
            description: 'Путешествие Кратоса и Атрея продолжается.',
            status: 'approved',
            isGameOfWeek: false
        }
    ];

    // ===== ОПРЕДЕЛЕНИЕ РОЛИ =====
    async function determineRole(user) {
        if (!user) return 'guest';
        if (user.email === CHIEF_EMAIL) return 'chief';

        try {
            const adminsRef = collection(db, 'admins');
            const q = query(adminsRef, where('email', '==', user.email));
            const snapshot = await getDocs(q);
            if (!snapshot.empty) return 'admin';
        } catch (e) {
            console.warn('Ошибка проверки админа:', e);
        }
        return 'developer';
    }

    // ===== ЗАГРУЗКА ИГР =====
    function loadGames() {
        const gamesRef = collection(db, 'games');
        
        onSnapshot(gamesRef, (snapshot) => {
            if (snapshot.empty) {
                // Если игр нет, загружаем демо
                loadDemoGames();
                return;
            }
            
            allGames = [];
            snapshot.forEach(doc => {
                allGames.push({ id: doc.id, ...doc.data() });
            });
            renderGames();
            updateUI();
        }, (error) => {
            console.error('Ошибка загрузки игр:', error);
            // Если ошибка, показываем демо
            loadDemoGames();
        });
    }

    // ===== ЗАГРУЗКА ДЕМО-ИГР =====
    async function loadDemoGames() {
        try {
            // Проверяем, есть ли уже игры в Firestore
            const gamesRef = collection(db, 'games');
            const snapshot = await getDocs(gamesRef);
            
            if (snapshot.empty) {
                // Добавляем демо-игры
                for (const game of demoGames) {
                    await addDoc(collection(db, 'games'), game);
                }
                console.log('✅ Демо-игры добавлены в Firestore');
            }
            
            // Перезагружаем
            loadGames();
        } catch (error) {
            console.error('Ошибка загрузки демо:', error);
            // Показываем локальные демо
            allGames = demoGames.map((g, i) => ({ id: `demo-${i}`, ...g }));
            renderGames();
            updateUI();
        }
    }

    // ===== РЕНДЕР ИГР =====
    function renderGames() {
        if (!gamesGrid) return;

        if (allGames.length === 0) {
            gamesGrid.innerHTML = `
                <div style="grid-column:1/-1; text-align:center; padding:3rem; color:rgba(200,220,255,0.3);">
                    <div style="font-size:3rem; margin-bottom:1rem;">🎮</div>
                    <p>Игр пока нет. Добавьте первую игру!</p>
                </div>
            `;
            return;
        }

        let html = '';
        const gameOfWeek = allGames.find(g => g.isGameOfWeek === true);
        const approvedGames = allGames.filter(g => g.status === 'approved' && !g.isGameOfWeek);
        const pendingGames = allGames.filter(g => g.status === 'pending');
        const rejectedGames = allGames.filter(g => g.status === 'rejected');

        if (gameOfWeek) html += renderGameCard(gameOfWeek, true);
        approvedGames.forEach(game => html += renderGameCard(game, false));
        
        if (currentUserRole === 'admin' || currentUserRole === 'chief') {
            pendingGames.forEach(game => html += renderGameCard(game, false));
            rejectedGames.forEach(game => html += renderGameCard(game, false));
        }

        gamesGrid.innerHTML = html || `
            <div style="grid-column:1/-1; text-align:center; padding:3rem; color:rgba(200,220,255,0.3);">
                <div style="font-size:3rem; margin-bottom:1rem;">🎮</div>
                <p>Нет доступных игр</p>
            </div>
        `;
    }

    function renderGameCard(game, isGameOfWeek) {
        const statusText = {
            'pending': '⏳ На проверке',
            'approved': '✅ Одобрена',
            'rejected': '❌ Отклонена'
        };

        const statusClass = {
            'pending': 'status-pending',
            'approved': 'status-approved',
            'rejected': 'status-rejected'
        };

        let actionsHtml = '';
        if ((currentUserRole === 'admin' || currentUserRole === 'chief') && game.status === 'pending') {
            actionsHtml = `
                <div class="card-actions">
                    <button class="btn-approve" data-id="${game.id}">✅ Одобрить</button>
                    <button class="btn-reject" data-id="${game.id}">❌ Отклонить</button>
                </div>
            `;
        }

        if (currentUserRole === 'chief' && game.status === 'approved' && !game.isGameOfWeek) {
            actionsHtml += `
                <div class="card-actions">
                    <button class="btn-game-week" data-id="${game.id}">⭐ Сделать игрой недели</button>
                </div>
            `;
        }

        const weekBadge = game.isGameOfWeek ? '<span class="game-week-badge">⭐ Игра недели</span>' : '';
        const mediaBadge = game.mediaType === 'video' ? '🎬 Видео' : '🖼️ Фото';
        const isDemo = game.id && game.id.toString().startsWith('demo-') ? '<span class="demo-badge">📌 Демо</span>' : '';

        let previewHtml = '';
        if (game.mediaUrl) {
            if (game.mediaType === 'video') {
                previewHtml = `
                    <video autoplay muted loop playsinline>
                        <source src="${game.mediaUrl}" type="video/mp4" />
                    </video>
                `;
            } else {
                previewHtml = `<img src="${game.mediaUrl}" alt="${game.title}" />`;
            }
        } else {
            previewHtml = `<div class="placeholder">🎮</div>`;
        }

        return `
            <div class="game-card">
                <div class="preview">
                    ${previewHtml}
                    <span class="media-type-badge" style="position:absolute;top:0.5rem;right:0.5rem;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);padding:0.15rem 0.6rem;border-radius:40px;font-size:0.6rem;color:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.05);">${mediaBadge}</span>
                </div>
                <div class="game-title">${game.title}</div>
                <div class="game-dev">${game.developer}</div>
                <span class="game-genre">${game.genre || 'Без жанра'}</span>
                ${weekBadge}
                ${isDemo}
                <span class="game-status ${statusClass[game.status] || ''}">${statusText[game.status] || game.status}</span>
                ${actionsHtml}
            </div>
        `;
    }

    // ===== ОБНОВЛЕНИЕ UI =====
    function updateUI() {
        if (currentUserRole === 'admin' || currentUserRole === 'chief') {
            adminPanelToggle.style.display = 'inline-block';
            gamesTitle.textContent = '📋 Управление играми';
        } else {
            adminPanelToggle.style.display = 'none';
            gamesTitle.textContent = '📚 Все игры';
        }

        if (currentUserRole === 'developer' || currentUserRole === 'admin' || currentUserRole === 'chief') {
            addGameForm.classList.add('active');
        } else {
            addGameForm.classList.remove('active');
        }
        hideError();
    }

    function showError(msg) {
        errorMessage.textContent = '⚠️ ' + msg;
        errorMessage.classList.add('active');
    }

    function hideError() {
        errorMessage.classList.remove('active');
    }

    // ===== ДОБАВЛЕНИЕ ИГРЫ =====
    submitGameBtn.addEventListener('click', async () => {
        if (!currentUser) {
            alert('Сначала войдите в систему!');
            return;
        }

        const title = gameTitle.value.trim();
        const developer = gameDeveloper.value.trim();
        const genre = gameGenre.value.trim();
        const description = gameDescription.value.trim();
        const url = mediaUrl.value.trim();
        const type = mediaType.value;

        if (!title || !developer) {
            alert('Заполните название и разработчика!');
            return;
        }

        if (!url) {
            alert('Введите ссылку на изображение или видео!');
            return;
        }

        try {
            await addDoc(collection(db, 'games'), {
                title,
                developer,
                genre: genre || 'Без жанра',
                description,
                mediaType: type,
                mediaUrl: url,
                status: 'pending',
                isGameOfWeek: false,
                submittedBy: currentUser.email,
                submittedAt: new Date().toISOString()
            });

            alert('✅ Игра отправлена на проверку!');
            gameTitle.value = '';
            gameDeveloper.value = '';
            gameGenre.value = '';
            gameDescription.value = '';
            mediaUrl.value = '';
            loadGames();
            hideError();
        } catch (error) {
            console.error('Ошибка отправки:', error);
            showError('Ошибка отправки игры: ' + error.message);
            alert('❌ Ошибка отправки игры: ' + error.message);
        }
    });

    // ===== ОБРАБОТЧИКИ ДЕЙСТВИЙ =====
    document.addEventListener('click', async (e) => {
        const id = e.target.dataset.id;
        if (!id) return;

        if (e.target.classList.contains('btn-approve')) {
            try {
                await updateDoc(doc(db, 'games', id), { status: 'approved' });
                loadGames();
            } catch (err) {
                showError('Ошибка одобрения: ' + err.message);
            }
        }

        if (e.target.classList.contains('btn-reject')) {
            try {
                await updateDoc(doc(db, 'games', id), { status: 'rejected' });
                loadGames();
            } catch (err) {
                showError('Ошибка отклонения: ' + err.message);
            }
        }

        if (e.target.classList.contains('btn-game-week')) {
            try {
                const gamesRef = collection(db, 'games');
                const q = query(gamesRef, where('isGameOfWeek', '==', true));
                const snapshot = await getDocs(q);
                for (const doc of snapshot.docs) {
                    await updateDoc(doc.ref, { isGameOfWeek: false });
                }
                await updateDoc(doc(db, 'games', id), { isGameOfWeek: true });
                loadGames();
            } catch (err) {
                showError('Ошибка назначения игры недели: ' + err.message);
            }
        }
    });

    // ===== АВТОРИЗАЦИЯ =====
    function openAuthModal() {
        authModal.classList.add('active');
        modalEmail.value = '';
        modalPassword.value = '';
        modalStatus.textContent = 'Войдите или создайте аккаунт';
        modalStatus.style.color = 'rgba(200, 220, 255, 0.6)';
    }

    function closeAuthModal() {
        authModal.classList.remove('active');
    }

    loginBtn.addEventListener('click', openAuthModal);
    authModalClose.addEventListener('click', closeAuthModal);
    authModal.addEventListener('click', (e) => {
        if (e.target === authModal) closeAuthModal();
    });

    function setModalStatus(msg, isError = false) {
        modalStatus.textContent = msg;
        modalStatus.style.color = isError ? '#ffa8a8' : 'rgba(200, 220, 255, 0.8)';
    }

    modalSignUpBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        const email = modalEmail.value.trim();
        const password = modalPassword.value.trim();

        if (!email || !password) {
            setModalStatus('Заполните все поля', true);
            return;
        }
        if (password.length < 6) {
            setModalStatus('Пароль должен быть минимум 6 символов', true);
            return;
        }

        try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            setModalStatus(`🎉 Добро пожаловать, ${userCredential.user.email}!`);
            modalEmail.value = '';
            modalPassword.value = '';
            setTimeout(closeAuthModal, 1200);
        } catch (error) {
            let msg = error.message;
            if (error.code === 'auth/email-already-in-use') msg = 'Этот email уже используется';
            else if (error.code === 'auth/invalid-email') msg = 'Некорректный email';
            else if (error.code === 'auth/weak-password') msg = 'Слишком слабый пароль';
            setModalStatus(`❌ ${msg}`, true);
        }
    });

    modalSignInBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        const email = modalEmail.value.trim();
        const password = modalPassword.value.trim();

        if (!email || !password) {
            setModalStatus('Заполните все поля', true);
            return;
        }

        try {
            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            setModalStatus(`🔓 Добро пожаловать, ${userCredential.user.email}!`);
            modalEmail.value = '';
            modalPassword.value = '';
            setTimeout(closeAuthModal, 1200);
        } catch (error) {
            let msg = error.message;
            if (error.code === 'auth/user-not-found') msg = 'Пользователь не найден';
            else if (error.code === 'auth/wrong-password') msg = 'Неверный пароль';
            else if (error.code === 'auth/invalid-email') msg = 'Некорректный email';
            setModalStatus(`❌ ${msg}`, true);
        }
    });

    // ===== ОТСЛЕЖИВАНИЕ СОСТОЯНИЯ =====
    onAuthStateChanged(auth, async (user) => {
        currentUser = user;
        
        if (user) {
            userEmailDisplay.textContent = user.email;
            loginBtn.style.display = 'none';
            logoutBtn.style.display = 'inline-block';
            
            currentUserRole = await determineRole(user);
            
            if (currentUserRole === 'chief') {
                userRoleDisplay.textContent = '👑 Главарь';
                userRoleDisplay.style.color = '#ffd866';
            } else if (currentUserRole === 'admin') {
                userRoleDisplay.textContent = '🛡️ Администратор';
                userRoleDisplay.style.color = '#66ffaa';
            } else {
                userRoleDisplay.textContent = '💻 Разработчик';
                userRoleDisplay.style.color = '#66aaff';
            }
            
            updateUI();
            loadGames();
        } else {
            userEmailDisplay.textContent = 'Гость';
            userRoleDisplay.textContent = '—';
            userRoleDisplay.style.color = 'rgba(200, 220, 255, 0.5)';
            loginBtn.style.display = 'inline-block';
            logoutBtn.style.display = 'none';
            currentUserRole = 'guest';
            updateUI();
            loadGames();
        }
    });

    logoutBtn.addEventListener('click', () => {
        signOut(auth).catch(console.warn);
    });

    adminPanelToggle.addEventListener('click', () => {
        const isVisible = addGameForm.classList.contains('active');
        if (isVisible) {
            addGameForm.classList.remove('active');
        } else {
            addGameForm.classList.add('active');
        }
    });

    loadGames();

    console.log('🚀 PulsarGames загружен!');
    console.log('👑 Главарь: voyager4vodorod@gmail.com');
    console.log('📸 Теперь можно загружать изображения и видео по ссылкам!');
    console.log('📌 Добавлены демо-игры для теста');
</script>

</body>
</html>
