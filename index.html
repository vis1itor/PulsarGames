<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulsarGames — Liquid Glass</title>
  <!-- Google Font для элегантного наклонного шрифта -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK (модули v9 compat) -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"
      }
    }
  </script>

  <style>
    /* Глобальный сброс и базовый фон */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 30% 40%, #0b0d1a, #03040b);
      font-family: 'Space Grotesk', sans-serif;
      padding: 1.5rem;
    }

    /* Главный стеклянный контейнер — эффект жидкого стекла */
    .glass-card {
      position: relative;
      max-width: 820px;
      width: 100%;
      padding: 3rem 2.5rem;
      background: rgba(20, 30, 50, 0.25);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 64px 24px 64px 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 
        0 30px 60px -20px rgba(0, 0, 0, 0.8),
        inset 0 0 0 1px rgba(255, 255, 255, 0.03),
        inset 0 0 40px rgba(120, 180, 255, 0.15);
      transition: all 0.3s ease;
      overflow: hidden;
      text-align: center;
      animation: glassPulse 6s infinite alternate ease-in-out;
    }

    .glass-card::before {
      content: '';
      position: absolute;
      top: -30%;
      left: -20%;
      width: 150%;
      height: 150%;
      background: radial-gradient(circle at 30% 50%, rgba(180, 220, 255, 0.08), transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: liquidShimmer 12s infinite alternate ease-in-out;
    }

    .glass-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 2px;
      background: conic-gradient(from 0deg, rgba(255,255,255,0.0), rgba(120, 180, 255, 0.2), rgba(255, 255, 255, 0.0), rgba(200, 140, 255, 0.15), rgba(255,255,255,0.0));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 1;
      opacity: 0.6;
    }

    .content {
      position: relative;
      z-index: 2;
    }

    /* Логотип / название */
    .brand-title {
      font-size: clamp(3.8rem, 15vw, 6.6rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #f0f7ff;
      text-shadow: 
        0 0 20px rgba(100, 180, 255, 0.5),
        0 0 60px rgba(80, 140, 255, 0.2),
        0 20px 40px rgba(0, 0, 0, 0.5);
      margin-bottom: 0.15em;
      background: linear-gradient(135deg, #ffffff 10%, #b0d4ff 70%, #d4bfff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 12px rgba(0, 20, 40, 0.6));
    }

    /* Слоган — исправлен, убрана опечатка */
    .tagline {
      font-size: clamp(1.8rem, 6vw, 3.2rem);
      font-weight: 300;
      font-style: italic;
      letter-spacing: 0.06em;
      color: rgba(235, 245, 255, 0.9);
      text-shadow: 0 0 30px rgba(70, 150, 255, 0.25), 0 8px 24px rgba(0, 0, 0, 0.4);
      margin-bottom: 0.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: center;
      gap: 0.3rem 0.8rem;
      background: linear-gradient(135deg, #d0e5ff, #f0f4ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 2px 10px rgba(0, 10, 30, 0.5));
    }

    /* Акцент на слово "Живые" */
    .tagline em {
      font-style: italic;
      font-weight: 600;
      color: #b8e2ff;
      text-shadow: 0 0 40px rgba(100, 200, 255, 0.6);
      background: linear-gradient(135deg, #b0e0ff, #ffffff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      padding: 0 0.1em;
    }

    .liquid-divider {
      width: 180px;
      height: 2px;
      margin: 1.2rem auto 0.8rem;
      background: linear-gradient(90deg, transparent, rgba(180, 220, 255, 0.6), rgba(220, 180, 255, 0.6), transparent);
      border-radius: 100%;
      filter: blur(1px);
      animation: dividerFlow 4s infinite alternate ease-in-out;
      box-shadow: 0 0 20px rgba(120, 180, 255, 0.3);
    }

    /* ---- Стили формы регистрации (Firebase) ---- */
    .auth-section {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
    }

    .auth-form {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      background: rgba(10, 18, 34, 0.3);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 1.8rem 1.8rem 2rem;
      border-radius: 40px 12px 40px 12px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      box-shadow: inset 0 0 30px rgba(80, 140, 255, 0.05);
      transition: all 0.3s;
    }

    .auth-form:hover {
      border-color: rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 0 40px rgba(80, 140, 255, 0.1);
    }

    .auth-form input {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 60px;
      padding: 0.9rem 1.4rem;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      font-weight: 300;
      color: #e8f0ff;
      outline: none;
      transition: all 0.25s;
      backdrop-filter: blur(4px);
    }

    .auth-form input::placeholder {
      color: rgba(200, 215, 255, 0.3);
      font-weight: 300;
      letter-spacing: 0.02em;
    }

    .auth-form input:focus {
      border-color: rgba(140, 200, 255, 0.4);
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 30px rgba(80, 160, 255, 0.1);
    }

    .auth-form .form-row {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .auth-form .form-row input {
      flex: 1;
      min-width: 120px;
    }

    .auth-btn {
      background: rgba(100, 180, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 60px;
      padding: 0.9rem 1.8rem;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: 0.06em;
      color: #d0e8ff;
      backdrop-filter: blur(8px);
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(80, 140, 255, 0.05);
      margin-top: 0.2rem;
      text-transform: uppercase;
      background: linear-gradient(135deg, rgba(60, 140, 255, 0.1), rgba(180, 120, 255, 0.05));
    }

    .auth-btn:hover {
      background: rgba(100, 180, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 40px rgba(80, 160, 255, 0.15);
      transform: scale(1.02);
      color: #ffffff;
    }

    .auth-btn:active {
      transform: scale(0.97);
    }

    .auth-status {
      font-size: 0.95rem;
      color: rgba(200, 220, 255, 0.7);
      background: rgba(0, 0, 0, 0.2);
      padding: 0.4rem 1.2rem;
      border-radius: 40px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.02);
      min-height: 2.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      width: 100%;
      max-width: 400px;
      transition: all 0.3s;
    }

    .auth-status .user-email {
      color: #b0d4ff;
      font-weight: 400;
      text-shadow: 0 0 20px rgba(80, 160, 255, 0.2);
    }

    .auth-status .logout-btn {
      background: rgba(255, 80, 80, 0.08);
      border: 1px solid rgba(255, 80, 80, 0.08);
      border-radius: 40px;
      padding: 0.2rem 1rem;
      font-size: 0.8rem;
      color: rgba(255, 180, 180, 0.7);
      cursor: pointer;
      transition: all 0.25s;
      font-family: inherit;
      backdrop-filter: blur(4px);
    }

    .auth-status .logout-btn:hover {
      background: rgba(255, 80, 80, 0.15);
      border-color: rgba(255, 80, 80, 0.2);
      color: #ffbaba;
    }

    /* Анимации */
    @keyframes glassPulse {
      0% {
        backdrop-filter: blur(14px) saturate(160%);
        -webkit-backdrop-filter: blur(14px) saturate(160%);
        box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255, 255, 255, 0.03), inset 0 0 40px rgba(100, 160, 255, 0.1);
      }
      100% {
        backdrop-filter: blur(20px) saturate(200%);
        -webkit-backdrop-filter: blur(20px) saturate(200%);
        box-shadow: 0 40px 80px -10px rgba(0, 0, 0, 0.9), inset 0 0 0 1px rgba(255, 255, 255, 0.08), inset 0 0 60px rgba(140, 200, 255, 0.25);
      }
    }

    @keyframes liquidShimmer {
      0% {
        transform: translateX(-10%) translateY(-5%) scale(1) rotate(0deg);
        opacity: 0.3;
      }
      50% {
        opacity: 0.8;
        transform: translateX(5%) translateY(8%) scale(1.2) rotate(2deg);
      }
      100% {
        transform: translateX(-5%) translateY(-8%) scale(1.1) rotate(-2deg);
        opacity: 0.5;
      }
    }

    @keyframes dividerFlow {
      0% {
        width: 120px;
        opacity: 0.4;
        transform: scaleX(0.8);
      }
      100% {
        width: 240px;
        opacity: 1;
        transform: scaleX(1);
      }
    }

    /* Пузырьки */
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.05), rgba(200, 230, 255, 0.02));
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.02);
      pointer-events: none;
      z-index: 0;
      animation: floatBubble 14s infinite alternate ease-in-out;
    }

    .bubble-1 {
      width: 120px;
      height: 120px;
      top: -20px;
      right: -20px;
      animation-duration: 18s;
    }

    .bubble-2 {
      width: 80px;
      height: 80px;
      bottom: 10px;
      left: 10px;
      animation-duration: 22s;
      animation-delay: -4s;
    }

    .bubble-3 {
      width: 50px;
      height: 50px;
      top: 30%;
      left: 5%;
      animation-duration: 16s;
      animation-delay: -8s;
    }

    @keyframes floatBubble {
      0% { transform: translate(0, 0) scale(1); opacity: 0.2; }
      50% { transform: translate(20px, -30px) scale(1.3); opacity: 0.5; }
      100% { transform: translate(-10px, 20px) scale(0.9); opacity: 0.15; }
    }

    /* Адаптив */
    @media (max-width: 600px) {
      .glass-card {
        padding: 2rem 1.2rem;
        border-radius: 48px 16px 48px 16px;
      }
      .tagline {
        flex-direction: column;
        gap: 0.1rem;
      }
      .auth-form .form-row {
        flex-direction: column;
      }
    }
    @media (max-width: 420px) {
      .glass-card { padding: 1.5rem 0.8rem; }
      .brand-title { font-size: 3.2rem; }
      .tagline { font-size: 1.6rem; }
    }

    .glass-card:hover {
      transform: scale(1.01) translateY(-4px);
      transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
      box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.9), inset 0 0 0 1px rgba(255, 255, 255, 0.1), inset 0 0 80px rgba(120, 180, 255, 0.2);
    }
  </style>
</head>
<body>

<div class="glass-card">
  <!-- декоративные пузырьки -->
  <div class="bubble bubble-1"></div>
  <div class="bubble bubble-2"></div>
  <div class="bubble bubble-3"></div>

  <div class="content">
    <!-- Название -->
    <h1 class="brand-title">PulsarGames</h1>

    <!-- Слоган — исправлен, убрана опечатка -->
    <div class="tagline">
      <span>Pulsar.</span>
      <span><em>Живые</em></span>
      <span>игры</span>
    </div>

    <div class="liquid-divider"></div>

    <!-- ===== БЛОК РЕГИСТРАЦИИ FIREBASE ===== -->
    <div class="auth-section" id="authSection">
      <!-- Форма регистрации / входа -->
      <form class="auth-form" id="authForm">
        <input type="email" id="emailInput" placeholder="Электронная почта" required />
        <input type="password" id="passwordInput" placeholder="Пароль (минимум 6 символов)" required minlength="6" />
        <div class="form-row">
          <button type="submit" class="auth-btn" id="signUpBtn">Зарегистрироваться</button>
          <button type="button" class="auth-btn" id="signInBtn">Войти</button>
        </div>
      </form>

      <!-- Статус / информация о пользователе -->
      <div class="auth-status" id="authStatus">
        <span>⚡ Войдите или создайте аккаунт</span>
      </div>
    </div>
  </div>
</div>

<script type="module">
  // ===== ИНИЦИАЛИЗАЦИЯ FIREBASE =====
  import { initializeApp } from 'firebase/app';
  import { 
    getAuth, 
    createUserWithEmailAndPassword, 
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from 'firebase/auth';

  const firebaseConfig = {
    apiKey: "AIzaSyBTXrdsl_SmJkFSBRT2gvtSJ6Iw4LvULXM",
    authDomain: "pulsargames-3ebc9.firebaseapp.com",
    projectId: "pulsargames-3ebc9",
    storageBucket: "pulsargames-3ebc9.firebasestorage.app",
    messagingSenderId: "503864871102",
    appId: "1:503864871102:web:0768bdfe18943933e976ef"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // ===== ЭЛЕМЕНТЫ DOM =====
  const emailInput = document.getElementById('emailInput');
  const passwordInput = document.getElementById('passwordInput');
  const signUpBtn = document.getElementById('signUpBtn');
  const signInBtn = document.getElementById('signInBtn');
  const authStatus = document.getElementById('authStatus');

  // ===== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ =====
  function setStatus(message, isError = false) {
    authStatus.innerHTML = message;
    authStatus.style.color = isError ? '#ffa8a8' : 'rgba(200, 220, 255, 0.7)';
  }

  function renderAuthState(user) {
    if (user) {
      // Пользователь авторизован
      setStatus(`
        <span>✅ Вы вошли как</span>
        <span class="user-email">${user.email}</span>
        <button class="logout-btn" id="logoutBtn">Выйти</button>
      `);
      // добавим обработчик на кнопку выхода
      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
          signOut(auth)
            .then(() => {
              setStatus('👋 Вы вышли из системы');
            })
            .catch((error) => {
              setStatus(`Ошибка выхода: ${error.message}`, true);
            });
        });
      }
    } else {
      // Пользователь не авторизован
      setStatus('⚡ Войдите или создайте аккаунт');
    }
  }

  // ===== ОТСЛЕЖИВАНИЕ СОСТОЯНИЯ АУТЕНТИФИКАЦИИ =====
  onAuthStateChanged(auth, (user) => {
    renderAuthState(user);
  });

  // ===== РЕГИСТРАЦИЯ =====
  signUpBtn.addEventListener('click', (e) => {
    e.preventDefault();
    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();

    if (!email || !password) {
      setStatus('Заполните все поля', true);
      return;
    }
    if (password.length < 6) {
      setStatus('Пароль должен быть минимум 6 символов', true);
      return;
    }

    createUserWithEmailAndPassword(auth, email, password)
      .then((userCredential) => {
        const user = userCredential.user;
        setStatus(`🎉 Добро пожаловать, ${user.email}!`);
        emailInput.value = '';
        passwordInput.value = '';
      })
      .catch((error) => {
        let msg = error.message;
        if (error.code === 'auth/email-already-in-use') msg = 'Этот email уже используется';
        else if (error.code === 'auth/invalid-email') msg = 'Некорректный email';
        else if (error.code === 'auth/weak-password') msg = 'Слишком слабый пароль';
        setStatus(`❌ ${msg}`, true);
      });
  });

  // ===== ВХОД =====
  signInBtn.addEventListener('click', (e) => {
    e.preventDefault();
    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();

    if (!email || !password) {
      setStatus('Заполните все поля', true);
      return;
    }

    signInWithEmailAndPassword(auth, email, password)
      .then((userCredential) => {
        const user = userCredential.user;
        setStatus(`🔓 Добро пожаловать, ${user.email}!`);
        emailInput.value = '';
        passwordInput.value = '';
      })
      .catch((error) => {
        let msg = error.message;
        if (error.code === 'auth/user-not-found') msg = 'Пользователь не найден';
        else if (error.code === 'auth/wrong-password') msg = 'Неверный пароль';
        else if (error.code === 'auth/invalid-email') msg = 'Некорректный email';
        setStatus(`❌ ${msg}`, true);
      });
  });

  // небольшая "защита" от отправки формы по Enter (чтобы не дублировать)
  document.getElementById('authForm').addEventListener('submit', (e) => e.preventDefault());
</script>

</body>
</html>
