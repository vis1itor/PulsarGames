<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulsarGames — Liquid Glass</title>
  <!-- Google Font для элегантного наклонного шрифта -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    /* Глобальный сброс и базовый фон */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 30% 40%, #0b0d1a, #03040b);
      font-family: 'Space Grotesk', sans-serif;
      padding: 1.5rem;
    }

    /* Главный стеклянный контейнер — эффект жидкого стекла */
    .glass-card {
      position: relative;
      max-width: 820px;
      width: 100%;
      padding: 4rem 3rem;
      background: rgba(20, 30, 50, 0.25);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 64px 24px 64px 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 
        0 30px 60px -20px rgba(0, 0, 0, 0.8),
        inset 0 0 0 1px rgba(255, 255, 255, 0.03),
        inset 0 0 40px rgba(120, 180, 255, 0.15);
      transition: all 0.3s ease;
      overflow: hidden;
      text-align: center;
      /* анимация "дыхания" стекла */
      animation: glassPulse 6s infinite alternate ease-in-out;
    }

    /* Псевдо-элемент для дополнительного "жидкого" свечения */
    .glass-card::before {
      content: '';
      position: absolute;
      top: -30%;
      left: -20%;
      width: 150%;
      height: 150%;
      background: radial-gradient(circle at 30% 50%, rgba(180, 220, 255, 0.08), transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: liquidShimmer 12s infinite alternate ease-in-out;
    }

    .glass-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 2px;
      background: conic-gradient(from 0deg, rgba(255,255,255,0.0), rgba(120, 180, 255, 0.2), rgba(255, 255, 255, 0.0), rgba(200, 140, 255, 0.15), rgba(255,255,255,0.0));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 1;
      opacity: 0.6;
    }

    /* Контент — поверх всех слоёв */
    .content {
      position: relative;
      z-index: 2;
    }

    /* Логотип / название */
    .brand-title {
      font-size: clamp(3.8rem, 15vw, 6.6rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #f0f7ff;
      text-shadow: 
        0 0 20px rgba(100, 180, 255, 0.5),
        0 0 60px rgba(80, 140, 255, 0.2),
        0 20px 40px rgba(0, 0, 0, 0.5);
      margin-bottom: 0.15em;
      transition: all 0.2s;
      background: linear-gradient(135deg, #ffffff 10%, #b0d4ff 70%, #d4bfff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 12px rgba(0, 20, 40, 0.6));
      word-break: break-word;
    }

    /* Слоган — живой, наклонный шрифт */
    .tagline {
      font-size: clamp(1.8rem, 6vw, 3.2rem);
      font-weight: 300;
      font-style: italic;       /* наклонный шрифт */
      letter-spacing: 0.06em;
      color: rgba(235, 245, 255, 0.9);
      text-shadow: 
        0 0 30px rgba(70, 150, 255, 0.25),
        0 8px 24px rgba(0, 0, 0, 0.4);
      margin-bottom: 0.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: center;
      gap: 0.3rem 0.8rem;
      background: linear-gradient(135deg, #d0e5ff, #f0f4ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 2px 10px rgba(0, 10, 30, 0.5));
      transition: all 0.3s;
    }

    /* Акцент на слово "Живые" — дополнительная выразительность */
    .tagline em {
      font-style: italic;
      font-weight: 600;
      color: #b8e2ff;
      text-shadow: 0 0 40px rgba(100, 200, 255, 0.6);
      background: linear-gradient(135deg, #b0e0ff, #ffffff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      padding: 0 0.1em;
    }

    /* декоративная линия под слоганом — жидкая */
    .liquid-divider {
      width: 180px;
      height: 2px;
      margin: 1.2rem auto 0.8rem;
      background: linear-gradient(90deg, transparent, rgba(180, 220, 255, 0.6), rgba(220, 180, 255, 0.6), transparent);
      border-radius: 100%;
      filter: blur(1px);
      animation: dividerFlow 4s infinite alternate ease-in-out;
      box-shadow: 0 0 20px rgba(120, 180, 255, 0.3);
    }

    /* дополнительный текст "игр" в стиле стекла */
    .sub-note {
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(200, 220, 255, 0.5);
      margin-top: 1rem;
      backdrop-filter: blur(4px);
      padding: 0.3rem 1.2rem;
      border-radius: 40px;
      display: inline-block;
      border: 1px solid rgba(255, 255, 255, 0.03);
      background: rgba(255, 255, 255, 0.02);
      transition: all 0.3s;
    }

    /* Анимации */
    @keyframes glassPulse {
      0% {
        backdrop-filter: blur(14px) saturate(160%);
        -webkit-backdrop-filter: blur(14px) saturate(160%);
        box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255, 255, 255, 0.03), inset 0 0 40px rgba(100, 160, 255, 0.1);
      }
      100% {
        backdrop-filter: blur(20px) saturate(200%);
        -webkit-backdrop-filter: blur(20px) saturate(200%);
        box-shadow: 0 40px 80px -10px rgba(0, 0, 0, 0.9), inset 0 0 0 1px rgba(255, 255, 255, 0.08), inset 0 0 60px rgba(140, 200, 255, 0.25);
      }
    }

    @keyframes liquidShimmer {
      0% {
        transform: translateX(-10%) translateY(-5%) scale(1) rotate(0deg);
        opacity: 0.3;
      }
      50% {
        opacity: 0.8;
        transform: translateX(5%) translateY(8%) scale(1.2) rotate(2deg);
      }
      100% {
        transform: translateX(-5%) translateY(-8%) scale(1.1) rotate(-2deg);
        opacity: 0.5;
      }
    }

    @keyframes dividerFlow {
      0% {
        width: 120px;
        opacity: 0.4;
        transform: scaleX(0.8);
      }
      100% {
        width: 240px;
        opacity: 1;
        transform: scaleX(1);
      }
    }

    /* Адаптивность */
    @media (max-width: 600px) {
      .glass-card {
        padding: 2.5rem 1.5rem;
        border-radius: 48px 16px 48px 16px;
      }
      .tagline {
        flex-direction: column;
        gap: 0.1rem;
      }
    }

    /* маленькие "пузырьки" для эффекта жидкости — чисто декоративно */
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.05), rgba(200, 230, 255, 0.02));
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.02);
      pointer-events: none;
      z-index: 0;
      animation: floatBubble 14s infinite alternate ease-in-out;
    }

    .bubble-1 {
      width: 120px;
      height: 120px;
      top: -20px;
      right: -20px;
      animation-duration: 18s;
    }

    .bubble-2 {
      width: 80px;
      height: 80px;
      bottom: 10px;
      left: 10px;
      animation-duration: 22s;
      animation-delay: -4s;
    }

    .bubble-3 {
      width: 50px;
      height: 50px;
      top: 30%;
      left: 5%;
      animation-duration: 16s;
      animation-delay: -8s;
    }

    @keyframes floatBubble {
      0% { transform: translate(0, 0) scale(1); opacity: 0.2; }
      50% { transform: translate(20px, -30px) scale(1.3); opacity: 0.5; }
      100% { transform: translate(-10px, 20px) scale(0.9); opacity: 0.15; }
    }

    /* адаптация текста для маленьких экранов */
    @media (max-width: 420px) {
      .glass-card {
        padding: 2rem 1rem;
      }
      .brand-title {
        font-size: 3.2rem;
      }
      .tagline {
        font-size: 1.6rem;
      }
    }

    /* интерактивность — лёгкое смещение при наведении */
    .glass-card:hover {
      transform: scale(1.01) translateY(-4px);
      transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
      box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.9), inset 0 0 0 1px rgba(255, 255, 255, 0.1), inset 0 0 80px rgba(120, 180, 255, 0.2);
    }
  </style>
</head>
<body>

  <div class="glass-card">
    <!-- декоративные пузырьки (жидкий эффект) -->
    <div class="bubble bubble-1"></div>
    <div class="bubble bubble-2"></div>
    <div class="bubble bubble-3"></div>

    <div class="content">
      <!-- Название PulsarGames -->
      <h1 class="brand-title">PulsarGames</h1>

      <!-- Слоган с наклонным шрифтом, слово "Живые" выделено -->
      <div class="tagline">
        <span>Pulsar.</span>
        <span><em>Живые</em></span>
        <span>игры из</span>
      </div>

      <!-- декоративная линия -->
      <div class="liquid-divider"></div>

      <!-- дополнительный текст "игр" в стиле стекла (необязательно, для атмосферы) -->
      <div class="sub-note">✦ жидкое стекло ✦</div>
    </div>
  </div>

</body>
</html>
