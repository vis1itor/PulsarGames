<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulsarGames — площадка игр</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"
      }
    }
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 30% 40%, #0b0d1a, #03040b);
      font-family: 'Space Grotesk', sans-serif;
      padding: 2rem 1.5rem;
      color: #e8f0ff;
    }

    /* ----- ГЛАВНЫЙ КОНТЕЙНЕР ----- */
    .app-wrapper {
      max-width: 1280px;
      margin: 0 auto;
    }

    /* ----- ШАПКА (liquid glass) ----- */
    .header-glass {
      background: rgba(20, 30, 50, 0.2);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 48px 16px 48px 16px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 1.8rem 2.5rem;
      margin-bottom: 3rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1.2rem;
      box-shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255, 255, 255, 0.03);
      animation: glassPulse 6s infinite alternate ease-in-out;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .brand h1 {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 10%, #b0d4ff 70%, #d4bfff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 12px rgba(0, 20, 40, 0.6));
      letter-spacing: 0.02em;
    }

    .brand .tagline-mini {
      font-style: italic;
      font-weight: 300;
      font-size: 1.1rem;
      color: rgba(200, 220, 255, 0.6);
      background: rgba(255,255,255,0.03);
      padding: 0.2rem 1rem;
      border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.04);
    }

    .auth-pill {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: rgba(10, 18, 34, 0.3);
      backdrop-filter: blur(6px);
      padding: 0.4rem 1.2rem 0.4rem 1.6rem;
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .auth-pill .user-email {
      font-size: 0.9rem;
      color: #b0d4ff;
    }

    .auth-pill .logout-btn {
      background: rgba(255, 80, 80, 0.08);
      border: 1px solid rgba(255, 80, 80, 0.08);
      border-radius: 40px;
      padding: 0.2rem 1rem;
      font-size: 0.8rem;
      color: rgba(255, 180, 180, 0.7);
      cursor: pointer;
      transition: all 0.25s;
      font-family: inherit;
    }

    .auth-pill .logout-btn:hover {
      background: rgba(255, 80, 80, 0.15);
      border-color: rgba(255, 80, 80, 0.2);
      color: #ffbaba;
    }

    /* ----- СЕТКА КАРТОЧЕК ИГР ----- */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 2rem;
    }

    .game-card {
      background: rgba(20, 30, 50, 0.2);
      backdrop-filter: blur(12px) saturate(160%);
      -webkit-backdrop-filter: blur(12px) saturate(160%);
      border-radius: 32px 12px 32px 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 1.2rem 1.2rem 1.5rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px -15px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .game-card:hover {
      transform: translateY(-6px) scale(1.01);
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 25px 50px -15px rgba(0, 0, 0, 0.9), inset 0 0 40px rgba(100, 180, 255, 0.05);
    }

    .game-card .preview {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 20px 8px 20px 8px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: rgba(255, 255, 255, 0.08);
      transition: all 0.3s;
    }

    .game-card:hover .preview {
      border-color: rgba(255, 255, 255, 0.1);
    }

    .game-card .preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .game-card .game-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-top: 0.4rem;
      background: linear-gradient(135deg, #f0f7ff, #b0d4ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .game-card .game-developer {
      font-size: 0.9rem;
      font-weight: 300;
      color: rgba(200, 215, 255, 0.5);
      letter-spacing: 0.02em;
    }

    .game-card .game-genre-tag {
      display: inline-block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      background: rgba(100, 180, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.04);
      color: rgba(200, 220, 255, 0.5);
      margin-top: 0.2rem;
      align-self: flex-start;
    }

    /* ----- ОВЕРЛЕЙ (детальная страница игры) ----- */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(3, 4, 11, 0.85);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      z-index: 1000;
      padding: 2rem;
      align-items: center;
      justify-content: center;
      animation: overlayIn 0.35s ease;
    }

    .overlay.active {
      display: flex;
    }

    @keyframes overlayIn {
      0% { opacity: 0; backdrop-filter: blur(0px); }
      100% { opacity: 1; backdrop-filter: blur(20px); }
    }

    .overlay-content {
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      background: rgba(20, 30, 50, 0.25);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 48px 16px 48px 16px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 2.5rem 2.5rem 2rem;
      box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.9), inset 0 0 0 1px rgba(255, 255, 255, 0.03);
      position: relative;
    }

    .overlay-close {
      position: absolute;
      top: 1.2rem;
      right: 1.8rem;
      font-size: 2rem;
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: all 0.25s;
      font-family: inherit;
      line-height: 1;
    }

    .overlay-close:hover {
      color: rgba(255, 255, 255, 0.6);
      transform: rotate(90deg);
    }

    .overlay-title {
      font-size: 2.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff, #b0d4ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.2rem;
    }

    .overlay-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem 2.5rem;
      margin: 1rem 0 1.5rem;
      font-size: 1rem;
      color: rgba(200, 220, 255, 0.6);
    }

    .overlay-meta span strong {
      color: rgba(220, 235, 255, 0.8);
      font-weight: 400;
    }

    .overlay-download-btn {
      background: rgba(100, 180, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 60px;
      padding: 0.9rem 2.8rem;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 1.2rem;
      letter-spacing: 0.06em;
      color: #d0e8ff;
      backdrop-filter: blur(8px);
      cursor: pointer;
      transition: all 0.3s ease;
      background: linear-gradient(135deg, rgba(60, 140, 255, 0.1), rgba(180, 120, 255, 0.05));
      margin: 1rem 0 1.5rem;
      display: inline-block;
    }

    .overlay-download-btn:hover {
      background: rgba(100, 180, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 40px rgba(80, 160, 255, 0.15);
      transform: scale(1.02);
      color: #ffffff;
    }

    .overlay-media {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-top: 1.2rem;
    }

    .overlay-media .media-item {
      aspect-ratio: 16 / 9;
      border-radius: 20px 8px 20px 8px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.15);
    }

    .overlay-media .media-item img,
    .overlay-media .media-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .overlay-media .media-item.trailer {
      grid-column: span 2;
    }

    /* ----- АНИМАЦИИ ----- */
    @keyframes glassPulse {
      0% {
        backdrop-filter: blur(14px) saturate(160%);
        box-shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255, 255, 255, 0.03);
      }
      100% {
        backdrop-filter: blur(20px) saturate(200%);
        box-shadow: 0 30px 60px -10px rgba(0, 0, 0, 0.9), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      }
    }

    /* ----- АДАПТИВ ----- */
    @media (max-width: 720px) {
      .header-glass {
        flex-direction: column;
        align-items: stretch;
        padding: 1.2rem 1.5rem;
      }
      .brand h1 { font-size: 1.8rem; }
      .overlay-content { padding: 1.8rem 1.2rem; }
      .overlay-title { font-size: 2rem; }
      .games-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.2rem; }
    }

    @media (max-width: 480px) {
      .games-grid { grid-template-columns: 1fr 1fr; gap: 0.8rem; }
      .game-card { padding: 0.8rem; }
      .game-card .game-title { font-size: 1rem; }
    }

    /* скролл для оверлея */
    .overlay-content::-webkit-scrollbar {
      width: 4px;
    }
    .overlay-content::-webkit-scrollbar-track {
      background: transparent;
    }
    .overlay-content::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
    }
  </style>
</head>
<body>

<div class="app-wrapper">

  <!-- ШАПКА -->
  <header class="header-glass">
    <div class="brand">
      <h1>PulsarGames</h1>
      <span class="tagline-mini">✦ живые игры</span>
    </div>
    <div class="auth-pill" id="authPill">
      <span class="user-email" id="userEmailDisplay">Гость</span>
      <button class="logout-btn" id="logoutBtn" style="display:none;">Выйти</button>
    </div>
  </header>

  <!-- СЕТКА КАРТОЧЕК -->
  <div class="games-grid" id="gamesGrid">
    <!-- карточки генерируются js -->
  </div>

</div>

<!-- ОВЕРЛЕЙ -->
<div class="overlay" id="gameOverlay">
  <div class="overlay-content" id="overlayContent">
    <button class="overlay-close" id="overlayClose">✕</button>
    <div class="overlay-title" id="overlayTitle">Название игры</div>
    <div class="overlay-meta" id="overlayMeta">
      <span><strong>Разработчик:</strong> <span id="overlayDev">—</span></span>
      <span><strong>Жанр:</strong> <span id="overlayGenre">—</span></span>
    </div>
    <button class="overlay-download-btn" id="overlayDownloadBtn">⬇ Скачать</button>
    <div class="overlay-media" id="overlayMedia">
      <!-- скриншоты и трейлер вставляются js -->
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from 'firebase/app';
  import { getAuth, onAuthStateChanged, signOut } from 'firebase/auth';

  // ===== FIREBASE =====
  const firebaseConfig = {
    apiKey: "AIzaSyBTXrdsl_SmJkFSBRT2gvtSJ6Iw4LvULXM",
    authDomain: "pulsargames-3ebc9.firebaseapp.com",
    projectId: "pulsargames-3ebc9",
    storageBucket: "pulsargames-3ebc9.firebasestorage.app",
    messagingSenderId: "503864871102",
    appId: "1:503864871102:web:0768bdfe18943933e976ef"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // ===== DOM =====
  const userEmailDisplay = document.getElementById('userEmailDisplay');
  const logoutBtn = document.getElementById('logoutBtn');
  const gamesGrid = document.getElementById('gamesGrid');
  const overlay = document.getElementById('gameOverlay');
  const overlayClose = document.getElementById('overlayClose');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayDev = document.getElementById('overlayDev');
  const overlayGenre = document.getElementById('overlayGenre');
  const overlayMedia = document.getElementById('overlayMedia');
  const overlayDownloadBtn = document.getElementById('overlayDownloadBtn');

  // ===== ДАННЫЕ ИГР =====
  const games = [
    {
      id: 1,
      title: 'Echoes of the Void',
      developer: 'StarForge Studios',
      genre: 'Sci-Fi RPG',
      preview: '🌌',
      screenshots: ['🎮', '🪐', '🚀'],
      trailer: '🎬'
    },
    {
      id: 2,
      title: 'Neon Drift',
      developer: 'Phantom Pixel',
      genre: 'Racing / Cyberpunk',
      preview: '🏎️',
      screenshots: ['🌃', '🏁', '💠'],
      trailer: '🎥'
    },
    {
      id: 3,
      title: 'Crystal Saga',
      developer: 'Moonlight Forge',
      genre: 'Fantasy Adventure',
      preview: '🗡️',
      screenshots: ['🏰', '🧙', '🐉'],
      trailer: '📽️'
    },
    {
      id: 4,
      title: 'Rust & Ruin',
      developer: 'Wasteland Interactive',
      genre: 'Survival / Post-Apo',
      preview: '⚙️',
      screenshots: ['🏜️', '🔧', '💀'],
      trailer: '🎞️'
    }
  ];

  // ===== РЕНДЕР КАРТОЧЕК =====
  function renderGames() {
    gamesGrid.innerHTML = games.map(game => `
      <div class="game-card" data-id="${game.id}">
        <div class="preview">${game.preview}</div>
        <div class="game-title">${game.title}</div>
        <div class="game-developer">${game.developer}</div>
        <span class="game-genre-tag">${game.genre}</span>
      </div>
    `).join('');

    // Клик по карточке → открыть оверлей
    document.querySelectorAll('.game-card').forEach(card => {
      card.addEventListener('click', () => {
        const id = parseInt(card.dataset.id);
        const game = games.find(g => g.id === id);
        if (game) openOverlay(game);
      });
    });
  }

  // ===== ОТКРЫТЬ ОВЕРЛЕЙ =====
  function openOverlay(game) {
    overlayTitle.textContent = game.title;
    overlayDev.textContent = game.developer;
    overlayGenre.textContent = game.genre;
    overlayDownloadBtn.textContent = `⬇ Скачать ${game.title}`;

    // Медиа: скриншоты + трейлер
    let mediaHTML = '';
    // скриншоты
    game.screenshots.forEach((shot, idx) => {
      mediaHTML += `<div class="media-item">${shot}</div>`;
    });
    // трейлер (занимает 2 колонки)
    mediaHTML += `<div class="media-item trailer">🎬 трейлер: ${game.trailer}</div>`;

    overlayMedia.innerHTML = mediaHTML;
    overlay.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  // ===== ЗАКРЫТЬ ОВЕРЛЕЙ =====
  function closeOverlay() {
    overlay.classList.remove('active');
    document.body.style.overflow = '';
  }

  overlayClose.addEventListener('click', closeOverlay);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeOverlay();
  });

  // Кнопка скачивания (заглушка)
  overlayDownloadBtn.addEventListener('click', () => {
    alert(`🔽 Начинается загрузка "${overlayTitle.textContent}" (демо-режим)`);
  });

  // ===== AUTH =====
  onAuthStateChanged(auth, (user) => {
    if (user) {
      userEmailDisplay.textContent = user.email;
      logoutBtn.style.display = 'inline-block';
    } else {
      userEmailDisplay.textContent = 'Гость';
      logoutBtn.style.display = 'none';
    }
  });

  logoutBtn.addEventListener('click', () => {
    signOut(auth).catch(console.warn);
  });

  // ===== СТАРТ =====
  renderGames();
</script>

</body>
</html>
